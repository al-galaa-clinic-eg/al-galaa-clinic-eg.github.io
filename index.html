const DOCTOR_COLORS = [
  { dot: "bg-teal-500", chip: "bg-teal-50 text-teal-700 border-teal-200" },
  { dot: "bg-cyan-500", chip: "bg-cyan-50 text-cyan-700 border-cyan-200" },
  { dot: "bg-rose-500", chip: "bg-rose-50 text-rose-700 border-rose-200" },

  { dot: "bg-orange-500", chip: "bg-orange-50 text-orange-700 border-orange-200" },
  { dot: "bg-fuchsia-500", chip: "bg-fuchsia-50 text-fuchsia-700 border-fuchsia-200" },
];
const MONTH_NAMES = ["January","February","March","April","May","June","July","August","September","October","November","December"];
const WEEKDAY_LABELS = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const FDI_UPPER = [18,17,16,15,14,13,12,11,21,22,23,24,25,26,27,28];
const FDI_LOWER = [48,47,46,45,44,43,42,41,31,32,33,34,35,36,37,38];

function pad(n) { return n < 10 ? `0${n}` : `${n}`; }
function toDateStr(y, m, d) { return `${y}-${pad(m + 1)}-${pad(d)}`; }
function todayStr() { const t = new Date(); return toDateStr(t.getFullYear(), t.getMonth(), t.getDate()); }
function formatLongDate(dateStr) {
  const [y, m, d] = dateStr.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString("en-US", { weekday: "long", year: "numeric", month: "long", day: "numeric" });
}
function money(n) { return `EGP ${Number(n || 0).toLocaleString("en-US", { maximumFractionDigits: 2 })}`; }
function timeAgo(isoString) {
  const diffMs = Date.now() - new Date(isoString).getTime();
  const mins = Math.floor(diffMs / 60000);
  if (mins < 1) return "just now";
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  return `${days}d ago`;
}
function patientPayments(patient, payments) {
  if (!patient) return [];
  return payments.filter((p) => (p.patientId && p.patientId === patient.id) || (!p.patientId && p.patientName?.toLowerCase() === patient.name?.toLowerCase()));
}
function isPatientFullyPaid(patient, payments) {
  const pays = patientPayments(patient, payments);
  if (pays.length === 0) return false;
  return pays.every((p) => Number(p.totalCost || 0) - Number(p.paidAmount || 0) <= 0);
}
// A procedure/treatment is "Completed" if either (a) it's tied to an appointment marked done, or
// (b) it's a walk-in with no appointment but the patient has paid in full — per clinic policy.
function isTreatmentCompleted(treatment, patient, appointments, payments) {
  const linkedDoneAppt = appointments.some((a) => a.date === treatment.date && a.doctorId === treatment.doctorId && a.patientName?.toLowerCase() === patient?.name?.toLowerCase() && a.status === "done");
  if (linkedDoneAppt) return true;
  return isPatientFullyPaid(patient, payments);
}
function colorFor(doctors, doctorId) {
  const idx = doctors.findIndex((d) => d.id === doctorId);
  return DOCTOR_COLORS[(idx < 0 ? 0 : idx) % DOCTOR_COLORS.length];
}
function withId(snapshot) { return snapshot.docs.map((d) => ({ id: d.id, ...d.data() })); }
const MAX_ATTACHMENT_BYTES = 900000; // ~900KB raw, Firestore documents cap at 1MB including base64 overhead
function readFileAsDataUrl(file) {
  return new Promise((resolve, reject) => {
    const reader = new FileReader();
    reader.onload = () => resolve(reader.result);
    reader.onerror = reject;
    reader.readAsDataURL(file);
  });
}
function loadImage(dataUrl) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => resolve(img);
    img.onerror = reject;
    img.src = dataUrl;
  });
}
async function compressImageFile(file, maxDim = 1600, quality = 0.72) {
  const rawDataUrl = await readFileAsDataUrl(file);
  const img = await loadImage(rawDataUrl);
  let { width, height } = img;
  if (width > maxDim || height > maxDim) {
    const scale = maxDim / Math.max(width, height);
    width = Math.round(width * scale);
    height = Math.round(height * scale);
  }
  const canvas = document.createElement("canvas");
  canvas.width = width; canvas.height = height;
  canvas.getContext("2d").drawImage(img, 0, 0, width, height);
  return canvas.toDataURL("image/jpeg", quality);
}
function dataUrlSizeBytes(dataUrl) {
  const base64 = dataUrl.split(",")[1] || "";
  return Math.round((base64.length * 3) / 4);
}
function weekdayOf(dateStr) { const [y, m, d] = dateStr.split("-").map(Number); return new Date(y, m - 1, d).getDay(); }
function doctorStatusFor(doc, dateStr, availability) {
  const override = availability.find((av) => av.date === dateStr && av.doctorId === doc.id);
  if (override) return override.status; // "present" or "off", explicit override wins
  const scheduled = Array.isArray(doc.workingDays) ? doc.workingDays.includes(weekdayOf(dateStr)) : true;
  return scheduled ? "present" : "off";
}
function isDoctorPresent(doc, dateStr, availability) { return doctorStatusFor(doc, dateStr, availability) === "present"; }

// ---------- Login ----------
function LoginScreen() {
  const [email, setEmail] = useState("");
  const [password, setPassword] = useState("");
  const [error, setError] = useState("");
  const [busy, setBusy] = useState(false);
  const [resetMsg, setResetMsg] = useState("");

  async function submit(e) {
    e.preventDefault();
    setError(""); setBusy(true);
    try {
      await auth.signInWithEmailAndPassword(email.trim(), password);
    } catch (err) {
      setError("Incorrect email or password.");
    }
    setBusy(false);
  }
  async function forgotPassword() {
    if (!email) { setError("Type your email above first, then tap 'Forgot password'."); return; }
    try {
      await auth.sendPasswordResetEmail(email.trim());
      setResetMsg("Password reset email sent. Check your inbox.");
    } catch (err) {
      setError("Could not send reset email. Check the address and try again.");
    }
  }

  return (
    <div className="min-h-screen bg-sky-50 flex items-center justify-center p-5">
      <div className="w-full max-w-sm">
        <div className="flex flex-col items-center mb-8">
          <Logo size={56} />
          <h1 className="font-display text-2xl text-slate-800 mt-3">Al Galaa Clinic</h1>
          <p className="text-sm text-slate-500 mt-1">Staff sign in</p>
        </div>
        <form onSubmit={submit} className="bg-white rounded-2xl border border-amber-200 shadow-sm p-6">
          <Field label="Email"><input type="email" className={inputCls} value={email} onChange={(e) => setEmail(e.target.value)} autoFocus /></Field>
          <Field label="Password"><input type="password" className={inputCls} value={password} onChange={(e) => setPassword(e.target.value)} /></Field>
          {error && <p className="text-rose-600 text-sm mb-3">{error}</p>}
          {resetMsg && <p className="text-emerald-600 text-sm mb-3">{resetMsg}</p>}
          <button disabled={busy} type="submit" className={`w-full ${btnPrimary}`}>{busy ? "Signing in…" : "Sign in"}</button>
          <button type="button" onClick={forgotPassword} className="w-full text-xs text-slate-500 mt-3 hover:text-slate-600">Forgot password?</button>
        </form>
        <p className="text-center text-[11px] text-slate-600 mt-6">First time? See SETUP-GUIDE.md to create the first admin account.</p>
      </div>
    </div>
  );
}

// ---------- App ----------
function App() {
  const [authLoading, setAuthLoading] = useState(true);
  const [currentUser, setCurrentUser] = useState(null);
  const [doctors, setDoctors] = useState([]);
  const [appointments, setAppointments] = useState([]);
  const [availability, setAvailability] = useState([]);
  const [payments, setPayments] = useState([]);
  const [users, setUsers] = useState([]);
  const [procedures, setProcedures] = useState([]);
  const [patients, setPatients] = useState([]);
  const [treatments, setTreatments] = useState([]);
  const [presence, setPresence] = useState([]);
  const [callList, setCallList] = useState([]);
  const [attachments, setAttachments] = useState([]);
  const [seeded, setSeeded] = useState(false);
  const [tab, setTab] = useState("dashboard");
  const [searchOpen, setSearchOpen] = useState(false);

  useEffect(() => {
    const unsub = auth.onAuthStateChanged(async (fbUser) => {
      if (!fbUser) { setCurrentUser(null); setAuthLoading(false); return; }
      try {
        const profileSnap = await db.collection("users").doc(fbUser.uid).get();
        const profile = profileSnap.exists ? profileSnap.data() : { role: "doctor", name: fbUser.email };
        setCurrentUser({ uid: fbUser.uid, email: fbUser.email, ...profile });
      } catch (e) {
        setCurrentUser({ uid: fbUser.uid, email: fbUser.email, role: "doctor", name: fbUser.email });
      }
      setAuthLoading(false);
    });
    return unsub;
  }, []);

  useEffect(() => {
    if (!currentUser) return;
    const unsubs = [
      db.collection("doctors").onSnapshot((s) => setDoctors(withId(s))),
      db.collection("appointments").onSnapshot((s) => setAppointments(withId(s))),
      db.collection("availability").onSnapshot((s) => setAvailability(withId(s))),
      db.collection("payments").onSnapshot((s) => setPayments(withId(s))),
      db.collection("users").onSnapshot((s) => setUsers(withId(s))),
      db.collection("procedures").onSnapshot((s) => setProcedures(withId(s))),
      db.collection("patients").onSnapshot((s) => setPatients(withId(s))),
      db.collection("treatments").onSnapshot((s) => setTreatments(withId(s))),
      db.collection("attachments").onSnapshot((s) => setAttachments(withId(s))),
      db.collection("presence").onSnapshot((s) => setPresence(withId(s))),
      db.collection("callList").onSnapshot((s) => setCallList(withId(s))),
    ];
    return () => unsubs.forEach((u) => u());
  }, [currentUser]);

  // seed the default dental procedure catalog once, if an admin is signed in and it's empty
  useEffect(() => {
    if (!currentUser || currentUser.role !== "admin" || seeded) return;
    (async () => {
      const snap = await db.collection("procedures").limit(1).get();
      if (snap.empty) {
        const batch = db.batch();
        DEFAULT_PROCEDURES.forEach(([specialty, name]) => {
          const ref = db.collection("procedures").doc();
          batch.set(ref, { specialty, name });
        });
        await batch.commit();
      }
      setSeeded(true);
    })();
  }, [currentUser, seeded]);

  // presence heartbeat: lets an admin see who has ever logged in and who is currently active
  useEffect(() => {
    if (!currentUser) return;
    async function beat() {
      try {
        const ref = db.collection("presence").doc(currentUser.uid);
        const existing = await ref.get();
        const now = new Date().toISOString();
        await ref.set({
          name: currentUser.name,
          email: currentUser.email,
          role: currentUser.role,
          doctorId: currentUser.doctorId || null,
          lastSeen: now,
          loginAt: existing.exists ? existing.data().loginAt || now : now,
        }, { merge: true });
      } catch (e) { /* non-critical */ }
    }
    beat();
    const interval = setInterval(beat, 25000);
    return () => clearInterval(interval);
  }, [currentUser]);

  const isAdmin = currentUser?.role === "admin";
  function canEdit(doctorId) { return isAdmin || currentUser?.doctorId === doctorId; }

  if (authLoading) return <div className="min-h-screen bg-sky-50 flex items-center justify-center text-slate-500 text-sm">Loading…</div>;
  if (!currentUser) return <LoginScreen />;

  const tabs = [
    { key: "dashboard", label: "Dashboard", icon: "dashboard" },
    { key: "queue", label: "Queue", icon: "clock" },
    { key: "calendar", label: "Calendar", icon: "calendar" },
    { key: "patients", label: "Patients", icon: "patient" },
    { key: "calllist", label: "Call List", icon: "phone" },
    { key: "doctors", label: "Doctors", icon: "users" },
    { key: "procedures", label: "Procedures", icon: "procedure" },
    { key: "payments", label: "Payments", icon: "wallet" },
    { key: "reports", label: "Reports", icon: "chart" },
    ...(isAdmin ? [{ key: "activity", label: "Staff Activity", icon: "pulse" }] : []),
    { key: "account", label: "Account", icon: "user" },
  ];

  return (
    <div className="min-h-screen bg-sky-50 text-slate-800">
      <div className="bg-white border-b border-amber-200 sticky top-0 z-30">
        <div className="max-w-6xl mx-auto px-4 sm:px-6 h-16 flex items-center justify-between">
          <div className="flex items-center gap-2.5">
            <Logo size={32} />
            <div>
              <div className="font-display text-base leading-tight text-slate-800">Al Galaa Clinic</div>
              <div className="text-[11px] text-slate-500 leading-tight">{isAdmin ? "Administrator" : currentUser.name}</div>
            </div>
          </div>
          <div className="flex items-center gap-1">
            <button onClick={() => setSearchOpen(true)} className="p-2 rounded-full hover:bg-sky-50 text-slate-400" title="Find patient">{I("search", { size: 19 })}</button>
            <nav className="hidden lg:flex items-center gap-1 ml-2">
              {tabs.map((t) => (
                <button key={t.key} onClick={() => setTab(t.key)}
                  className={`flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium ${tab === t.key ? "bg-amber-50 text-amber-600" : "text-slate-400 hover:bg-sky-50"}`}>
                  {I(t.icon, { size: 16 })} {t.label}
                </button>
              ))}
              <button onClick={() => auth.signOut()} className="flex items-center gap-1.5 px-3 py-2 rounded-lg text-sm font-medium text-rose-600 hover:bg-rose-500/10 ml-1">
                {I("logout", { size: 16 })} Sign out
              </button>
            </nav>
          </div>
        </div>
      </div>

      <div className="max-w-6xl mx-auto px-4 sm:px-6 py-5 pb-24 lg:pb-8">
        {tab === "dashboard" && <DashboardTab doctors={doctors} appointments={appointments} availability={availability} payments={payments} patients={patients} currentUser={currentUser} isAdmin={isAdmin} onNavigate={setTab} />}
        {tab === "queue" && <QueueTab doctors={doctors} appointments={appointments} isAdmin={isAdmin} currentUser={currentUser} canEdit={canEdit} />}
        {tab === "calendar" && <CalendarTab doctors={doctors} appointments={appointments} availability={availability} procedures={procedures} patients={patients} currentUser={currentUser} isAdmin={isAdmin} canEdit={canEdit} />}
        {tab === "patients" && <PatientsTab patients={patients} appointments={appointments} payments={payments} doctors={doctors} procedures={procedures} treatments={treatments} attachments={attachments} currentUser={currentUser} isAdmin={isAdmin} canEdit={canEdit} />}
        {tab === "calllist" && <CallListTab callList={callList} doctors={doctors} currentUser={currentUser} isAdmin={isAdmin} canEdit={canEdit} />}
        {tab === "doctors" && <DoctorsTab doctors={doctors} users={users} patients={patients} isAdmin={isAdmin} />}
        {tab === "procedures" && <ProceduresTab procedures={procedures} isAdmin={isAdmin} />}
        {tab === "payments" && <PaymentsTab doctors={doctors} payments={payments} patients={patients} currentUser={currentUser} isAdmin={isAdmin} canEdit={canEdit} />}
        {tab === "reports" && <ReportsTab doctors={doctors} appointments={appointments} payments={payments} procedures={procedures} treatments={treatments} patients={patients} currentUser={currentUser} isAdmin={isAdmin} />}
        {tab === "activity" && isAdmin && <StaffActivityTab users={users} presence={presence} doctors={doctors} />}
        {tab === "account" && <AccountTab currentUser={currentUser} />}
      </div>

      {searchOpen && <PatientSearch doctors={doctors} appointments={appointments} payments={payments} currentUser={currentUser} isAdmin={isAdmin} onClose={() => setSearchOpen(false)} />}

      <div className="lg:hidden fixed bottom-0 inset-x-0 bg-white border-t border-amber-200 flex z-30 overflow-x-auto">
        {tabs.map((t) => (
          <button key={t.key} onClick={() => setTab(t.key)} className={`flex-1 flex flex-col items-center gap-0.5 py-2.5 text-[10px] font-medium min-w-[52px] ${tab === t.key ? "text-amber-600" : "text-slate-500"}`}>
            {I(t.icon, { size: 17 })}{t.label}
          </button>
        ))}
      </div>
    </div>
  );
}

// ---------- Queue ----------
function QueueTab({ doctors, appointments, isAdmin, currentUser, canEdit }) {
  const [doctorFilter, setDoctorFilter] = useState("all");
  const t = todayStr();
  const todays = appointments.filter((a) => a.date === t && (doctorFilter === "all" || a.doctorId === doctorFilter));
  const waiting = todays.filter((a) => a.status === "scheduled").sort((a, b) => (a.time || "").localeCompare(b.time || ""));
  const done = todays.filter((a) => a.status === "done").sort((a, b) => (b.time || "").localeCompare(a.time || ""));
  const cancelled = todays.filter((a) => a.status === "cancelled");

  async function markDone(id) { await db.collection("appointments").doc(id).update({ status: "done" }); }
  async function markCancelled(id) { await db.collection("appointments").doc(id).update({ status: "cancelled" }); }

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <div>
          <h2 className="font-display text-lg text-slate-800">Today's queue</h2>
          <p className="text-xs text-slate-500">{formatLongDate(t)} · updates live for reception and doctors</p>
        </div>
        <select className="rounded-xl border border-sky-200 bg-sky-50 text-slate-800 px-3 py-2 text-sm" value={doctorFilter} onChange={(e) => setDoctorFilter(e.target.value)}>
          <option value="all">All doctors</option>
          {doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
        </select>
      </div>

      <div className="bg-white rounded-2xl border border-sky-100 overflow-hidden mb-5">
        <div className="px-4 py-3 bg-amber-50 border-b border-sky-100 flex items-center justify-between">
          <span className="text-sm font-semibold text-amber-700">Waiting now</span>
          <span className="text-xs text-slate-500">{waiting.length} patient{waiting.length !== 1 ? "s" : ""}</span>
        </div>
        {waiting.length === 0 && <div className="p-6 text-center text-sm text-slate-500">No one waiting right now.</div>}
        <div className="divide-y divide-sky-100">
          {waiting.map((a, i) => {
            const doc = doctors.find((d) => d.id === a.doctorId);
            const editable = canEdit(a.doctorId);
            return (
              <div key={a.id} className="flex items-center gap-3 px-4 py-3">
                <span className="w-7 h-7 rounded-full bg-amber-500 text-black text-sm font-bold flex items-center justify-center flex-shrink-0">{i + 1}</span>
                <div className="min-w-0 flex-1">
                  <div className="text-sm font-medium text-slate-800 truncate">{a.patientName}</div>
                  <div className="text-xs text-slate-500 flex items-center gap-1">{I("clock", { size: 11 })} {a.time || "—"} <span className={`ml-1 px-1.5 py-0.5 rounded-full border ${colorFor(doctors, a.doctorId).chip}`}>{doc?.name || "—"}</span></div>
                </div>
                {editable && (
                  <div className="flex gap-1.5 flex-shrink-0">
                    <button onClick={() => markDone(a.id)} className="text-xs font-medium px-2.5 py-1.5 rounded-lg bg-emerald-500 text-white hover:bg-emerald-600">Done</button>
                    <button onClick={() => markCancelled(a.id)} className="text-xs font-medium px-2.5 py-1.5 rounded-lg border border-sky-200 text-slate-500 hover:bg-sky-50">Cancel</button>
                  </div>
                )}
              </div>
            );
          })}
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-4">
        <div className="bg-white rounded-2xl border border-sky-100 overflow-hidden">
          <div className="px-4 py-2.5 bg-emerald-50 border-b border-sky-100 text-sm font-semibold text-emerald-700">Seen today ({done.length})</div>
          {done.length === 0 && <div className="p-4 text-center text-xs text-slate-500">No completed visits yet.</div>}
          <div className="divide-y divide-sky-100">
            {done.map((a) => {
              const doc = doctors.find((d) => d.id === a.doctorId);
              return <div key={a.id} className="px-4 py-2 text-xs text-slate-600 flex justify-between"><span>{a.time} · {a.patientName}</span><span className="text-slate-400">{doc?.name}</span></div>;
            })}
          </div>

// ---------- Staff Activity (admin only) ----------
function StaffActivityTab({ users, presence, doctors }) {
  const ONLINE_WINDOW_MS = 60 * 1000; // heartbeat every 25s, so under a minute means still open
  const now = Date.now();

  function statusFor(uid) {
    const rec = presence.find((p) => p.id === uid);
    if (!rec) return { label: "Never logged in", tone: "bg-sky-50 text-slate-500", lastSeen: null };
    const diff = now - new Date(rec.lastSeen).getTime();
    if (diff < ONLINE_WINDOW_MS) return { label: "Online now", tone: "bg-emerald-50 text-emerald-700", lastSeen: rec.lastSeen };
    return { label: `Last seen ${timeAgo(rec.lastSeen)}`, tone: "bg-sky-50 text-slate-500", lastSeen: rec.lastSeen };
  }

  const rows = users.map((u) => {
    const doc = doctors.find((d) => d.id === u.doctorId);
    return { ...u, displayName: u.name || doc?.name || u.email, status: statusFor(u.id) };
  }).sort((a, b) => {
    const aOn = a.status.label === "Online now" ? 0 : 1;
    const bOn = b.status.label === "Online now" ? 0 : 1;
    if (aOn !== bOn) return aOn - bOn;
    return (a.displayName || "").localeCompare(b.displayName || "");
  });

  const onlineCount = rows.filter((r) => r.status.label === "Online now").length;

  return (
    <div>
      <div className="mb-4">
        <h2 className="font-display text-lg text-slate-800">Staff activity</h2>
        <p className="text-xs text-slate-500">{onlineCount} of {rows.length} accounts online now · refreshes automatically</p>
      </div>
      <div className="bg-white rounded-2xl border border-sky-100 overflow-hidden">
        <div className="divide-y divide-sky-100">
          {rows.map((u) => (
            <div key={u.id} className="flex items-center justify-between px-4 py-3">
              <div className="flex items-center gap-2.5 min-w-0">
                <span className={`w-2 h-2 rounded-full flex-shrink-0 ${u.status.label === "Online now" ? "bg-emerald-500" : "bg-slate-300"}`} />
                <div className="min-w-0">
                  <div className="text-sm font-medium text-slate-800 truncate">{u.displayName}</div>
                  <div className="text-xs text-slate-500">{u.role === "admin" ? "Administrator" : "Doctor"} · {u.email}</div>
                </div>
              </div>
              <span className={`text-xs px-2 py-1 rounded-full flex-shrink-0 ${u.status.tone}`}>{u.status.label}</span>
            </div>
          ))}
          {rows.length === 0 && <div className="p-6 text-center text-sm text-slate-500">No staff accounts yet.</div>}
        </div>
      </div>
    </div>
  );
}

        <button onClick={() => onNavigate("patients")} className="text-left bg-white rounded-2xl border border-sky-100 p-4 hover:border-amber-500/40">

          <div className="text-xs text-slate-500 mb-1">This month's revenue</div>

          <div className="flex items-center justify-between mb-3">
            <h3 className="font-display text-base text-slate-800">Today's schedule</h3>

              const doc = doctors.find((d) => d.id === a.doctorId);
              const statusPill = { scheduled: "bg-sky-50 text-sky-700", done: "bg-emerald-50 text-emerald-700", cancelled: "bg-rose-50 text-rose-700" }[a.status] || "bg-sky-50 text-slate-400";
              return (
                <div key={a.id} className="flex items-center justify-between text-sm border-b border-sky-100 last:border-0 pb-2 last:pb-0">
                  <div className="flex items-center gap-2 min-w-0">
                    <span className="text-slate-500 text-xs w-12 flex-shrink-0">{a.time || "—"}</span>
                    <span className="text-slate-700 truncate">{a.patientName}</span>
                    <span className="text-slate-500 text-xs truncate">· {doc?.name || "—"}</span>
                  </div>
                  <span className={`px-1.5 py-0.5 rounded-full text-[11px] flex-shrink-0 ${statusPill}`}>{a.status}</span>

                <div key={doc.id} className="flex items-center justify-between text-sm">

function PatientsTab({ patients, appointments, payments, doctors, procedures, treatments, attachments, currentUser, isAdmin, canEdit }) {
  const [q, setQ] = useState("");
  const [doctorFilter, setDoctorFilter] = useState("all");

  async function save(form) {
    if (form.id) { const { id, ...rest } = form; await db.collection("patients").doc(id).update(rest); }
    else await db.collection("patients").add({ ...form, createdAt: new Date().toISOString() });
    setShowForm(null);
  }
  async function del(id) { await db.collection("patients").doc(id).delete(); setConfirmDelete(null); setOpenProfile(null); }

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="font-display text-lg text-slate-800">Patients</h2>
        <button onClick={() => setShowForm({ name: "", phone: "", age: "", gender: "", doctorId: isAdmin ? "" : currentUser.doctorId, medicalHistory: "" })} className="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-black text-sm font-semibold px-3.5 py-2 rounded-xl">{I("plus", { size: 16 })} Add patient</button>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        <div className="relative max-w-sm flex-1 min-w-[180px]">
          <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">{I("search", { size: 16 })}</span>
          <input className={`${inputCls} pl-9`} placeholder="Search by name or phone…" value={q} onChange={(e) => setQ(e.target.value)} />
        </div>
        {isAdmin && (
          <select className="rounded-xl border border-sky-200 bg-sky-50 text-slate-800 px-3 py-2 text-sm" value={doctorFilter} onChange={(e) => setDoctorFilter(e.target.value)}>
            <option value="all">All doctors</option>
            {doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        )}
      </div>
      {visible.length === 0 && <div className="bg-white rounded-2xl border border-sky-100 p-8 text-center text-slate-500 text-sm">{patients.length === 0 ? "No patients registered yet." : "No matching patients."}</div>}
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {visible.map((p) => {
          const visitCount = appointments.filter((a) => a.patientName?.toLowerCase() === p.name?.toLowerCase()).length;
          const treatCount = treatments.filter((t) => t.patientId === p.id).length;
          const doc = doctors.find((d) => d.id === p.doctorId);
          const editable = canEdit(p.doctorId);
          const patientProcedures = [...new Map(
            treatments
              .filter((t) => t.patientId === p.id)
              .map((t) => {
                const proc = procedures.find((pr) => pr.id === t.procedureId);
                return proc ? [proc.id, proc] : null;
              })
              .filter(Boolean)
          ).values()];
          return (
            <div key={p.id} className="bg-white rounded-2xl border border-sky-100 p-4 hover:border-amber-300 cursor-pointer" onClick={() => setOpenProfile(p)}>
              <div className="flex items-start justify-between">
                <div className="flex items-center gap-2.5 min-w-0">
                  <span className="w-9 h-9 rounded-full bg-amber-500 text-black flex items-center justify-center text-sm font-semibold flex-shrink-0">{p.name?.[0]?.toUpperCase() || "?"}</span>
                  <div className="min-w-0"><div className="text-sm font-semibold text-slate-800 truncate">{p.name}</div><div className="text-xs text-slate-500">{[p.age && `${p.age}y`, p.gender].filter(Boolean).join(" · ") || "—"}</div></div>
                </div>
                {editable && (
                  <div className="flex gap-1 flex-shrink-0" onClick={(e) => e.stopPropagation()}>
                    <button onClick={() => setShowForm(p)} className="p-1.5 rounded-lg hover:bg-sky-50 text-slate-400">{I("pencil", { size: 13 })}</button>
                    <button onClick={() => setConfirmDelete(p.id)} className="p-1.5 rounded-lg hover:bg-sky-50 text-rose-600">{I("trash", { size: 13 })}</button>
                  </div>
                )}
              </div>
              <div className="mt-3 text-xs text-slate-500 space-y-1">
                {p.phone && <div className="flex items-center gap-1">{I("phone", { size: 11 })} {p.phone}</div>}
                <div>{visitCount} visit{visitCount !== 1 ? "s" : ""} · {treatCount} treatment{treatCount !== 1 ? "s" : ""} on record</div>
                {doc && <div className="inline-block mt-1 px-1.5 py-0.5 rounded-full border border-sky-200 bg-sky-50 text-sky-700 text-[11px]">{doc.name}</div>}

                  <div className="flex flex-wrap gap-1 mt-1">

                    {patientProcedures.length > 3 && <span className="text-[11px] text-slate-400">+{patientProcedures.length - 3} more</span>}

              </div>
            </div>
          );

        <PatientProfile
          patient={patients.find((p) => p.id === openProfile.id) || openProfile}
          doctors={doctors}
          procedures={procedures}
          treatments={treatments.filter((t) => t.patientId === openProfile.id)}
          attachments={attachments.filter((a) => a.patientId === openProfile.id)}
          appointments={appointments.filter((a) => a.patientName?.toLowerCase() === openProfile.name?.toLowerCase())}
          payments={payments.filter((p) => p.patientName?.toLowerCase() === openProfile.name?.toLowerCase())}
          currentUser={currentUser}
          isAdmin={isAdmin}
          canEdit={canEdit}
          onClose={() => setOpenProfile(null)}
          onEditPatient={() => { setShowForm(openProfile); }}
          onDeletePatient={() => setConfirmDelete(openProfile.id)}
        />
      )}
      {confirmDelete && (
        <Sheet title="Delete patient?" onClose={() => setConfirmDelete(null)}>
          <p className="text-sm text-slate-400 mb-5">This removes the patient from the registry. Past appointments and payments already recorded under their name stay untouched.</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirmDelete(null)} className="flex-1 py-2.5 rounded-xl border border-sky-200 text-sm font-medium text-slate-600">Cancel</button>
            <button onClick={() => del(confirmDelete)} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium">Delete</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

function PatientProfile({ patient, doctors, procedures, treatments, attachments, appointments, payments, currentUser, isAdmin, canEdit, onClose, onEditPatient, onDeletePatient }) {
  const [selectedTooth, setSelectedTooth] = useState(null);
  const [showTreatmentForm, setShowTreatmentForm] = useState(null);
  const [confirmDeleteTreatment, setConfirmDeleteTreatment] = useState(null);
  const doc = doctors.find((d) => d.id === patient.doctorId);
  const patientEditable = canEdit(patient.doctorId);

  async function saveTreatment(form) {
    if (form.id) { const { id, ...rest } = form; await db.collection("treatments").doc(id).update(rest); }
    else await db.collection("treatments").add({ ...form, patientId: patient.id, patientName: patient.name, createdAt: new Date().toISOString() });
    setShowTreatmentForm(null);
  }
  async function deleteTreatment(id) { await db.collection("treatments").doc(id).delete(); setConfirmDeleteTreatment(null); }

  const sortedHistory = [...treatments].sort((a, b) => b.date.localeCompare(a.date));
  const toothTreatments = selectedTooth ? treatments.filter((t) => String(t.toothNumber) === String(selectedTooth)) : [];

  return (
    <Sheet title={patient.name} onClose={onClose} wide>
      <div className="flex items-start justify-between mb-4">
        <div className="text-xs text-slate-500 space-y-0.5">
          <div>{[patient.age && `${patient.age}y`, patient.gender, patient.phone].filter(Boolean).join(" · ") || "—"}</div>
          {doc && <div>Doctor: {doc.name}</div>}
        </div>
        {patientEditable && (
          <div className="flex gap-1">
            <button onClick={onEditPatient} className="p-1.5 rounded-lg hover:bg-sky-50 text-slate-400">{I("pencil", { size: 14 })}</button>
            <button onClick={onDeletePatient} className="p-1.5 rounded-lg hover:bg-sky-50 text-rose-600">{I("trash", { size: 14 })}</button>
          </div>
        )}
      </div>
      {patient.medicalHistory && (
        <div className="bg-sky-50 border border-sky-100 rounded-xl p-3 mb-5 text-sm text-slate-700">
          <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide mb-1">Medical history</div>
          {patient.medicalHistory}
        </div>
      )}

      <div className="mb-5">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Dental chart</div>
        <DentalChart treatments={treatments} selectedTooth={selectedTooth} onSelectTooth={setSelectedTooth} />
        {selectedTooth && (
          <div className="mt-3 bg-sky-50 border border-sky-100 rounded-xl p-3">
            <div className="flex items-center justify-between mb-2">
              <span className="text-sm font-semibold text-slate-700">Tooth {selectedTooth}</span>
              <button onClick={() => setShowTreatmentForm({ toothNumber: selectedTooth, doctorId: isAdmin ? "" : currentUser.doctorId, specialty: "", procedureId: "", date: todayStr(), notes: "" })} className="flex items-center gap-1 text-xs font-medium text-amber-600 hover:bg-amber-50 px-2 py-1 rounded-lg">{I("plus", { size: 13 })} Add treatment</button>
            </div>
            {toothTreatments.length === 0 && <p className="text-xs text-slate-500">No treatments recorded on this tooth yet.</p>}
            <div className="space-y-1.5">
              {toothTreatments.sort((a, b) => b.date.localeCompare(a.date)).map((t) => {
                const proc = procedures.find((p) => p.id === t.procedureId);
                const tdoc = doctors.find((d) => d.id === t.doctorId);
                return (
                  <div key={t.id} className="text-xs bg-white rounded-lg border border-sky-100 px-2.5 py-2 flex items-start justify-between">
                    <div><span className="font-medium text-slate-700">{proc ? `${proc.specialty} · ${proc.name}` : "Procedure"}</span><div className="text-slate-400">{t.date} · {tdoc?.name || "—"}</div></div>
                    {canEdit(t.doctorId) && <button onClick={() => setConfirmDeleteTreatment(t.id)} className="p-1 rounded hover:bg-sky-50 text-rose-500">{I("trash", { size: 12 })}</button>}
                  </div>
                );
              })}
            </div>
          </div>
        )}
      </div>

      <div className="mb-5">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Treatment history</div>
        {sortedHistory.length === 0 && <p className="text-sm text-slate-500">No treatments recorded yet. Select a tooth above to add one.</p>}
        <div className="space-y-1.5">
          {sortedHistory.map((t) => {
            const proc = procedures.find((p) => p.id === t.procedureId);
            const tdoc = doctors.find((d) => d.id === t.doctorId);
            const linkedFiles = attachments.filter((a) => a.treatmentId === t.id);
            return (
              <div key={t.id} className="text-sm border border-sky-100 rounded-xl px-3 py-2.5">
                <div className="flex items-start justify-between">
                  <div>
                    <div className="font-medium text-slate-800">Tooth {t.toothNumber} — {proc ? proc.name : "Procedure"}</div>
                    <div className="text-xs text-slate-500">{proc?.specialty} · {t.date} · {tdoc?.name || "—"}</div>
                    {t.notes && <div className="text-xs text-slate-400 mt-1">{t.notes}</div>}
                    {linkedFiles.length > 0 && <div className="text-[11px] text-amber-600 mt-1">{linkedFiles.length} file{linkedFiles.length > 1 ? "s" : ""} attached</div>}
                  </div>
                  {canEdit(t.doctorId) && <button onClick={() => setConfirmDeleteTreatment(t.id)} className="p-1.5 rounded-lg hover:bg-sky-50 text-rose-600 flex-shrink-0">{I("trash", { size: 13 })}</button>}
                </div>
              </div>
            );
          })}
        </div>
      </div>

      <div className="grid sm:grid-cols-2 gap-5 mb-5">
        <div>
          <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Appointment history</div>
          {appointments.length === 0 && <p className="text-sm text-slate-500">No appointments recorded yet.</p>}
          <div className="space-y-1.5 max-h-64 overflow-y-auto pr-1">
            {[...appointments].sort((a, b) => b.date.localeCompare(a.date)).map((a) => {
              const adoc = doctors.find((d) => d.id === a.doctorId);
              const statusPill = { scheduled: "bg-sky-50 text-sky-700", done: "bg-emerald-50 text-emerald-700", cancelled: "bg-rose-50 text-rose-700" }[a.status] || "bg-sky-50 text-slate-500";
              return (
                <div key={a.id} className="text-xs border border-sky-100 rounded-lg px-2.5 py-2 flex items-center justify-between">
                  <div><span className="font-medium text-slate-700">{a.date}</span> <span className="text-slate-400">{a.time}</span> · {adoc?.name || "—"}</div>
                  <span className={`px-1.5 py-0.5 rounded-full ${statusPill}`}>{a.status}</span>
                </div>
              );
            })}
          </div>
        </div>
        <div>
          <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide mb-2">Payment history</div>
          {payments.length === 0 && <p className="text-sm text-slate-500">No payments recorded yet.</p>}
          <div className="space-y-1.5 max-h-64 overflow-y-auto pr-1">
            {[...payments].sort((a, b) => b.date.localeCompare(a.date)).map((p) => {
              const pdoc = doctors.find((d) => d.id === p.doctorId);
              const remaining = Math.max(0, Number(p.totalCost || 0) - Number(p.paidAmount || 0));
              return (
                <div key={p.id} className="text-xs border border-sky-100 rounded-lg px-2.5 py-2 flex items-center justify-between">
                  <div><span className="font-medium text-slate-700">{p.date}</span> · {pdoc?.name || "—"}</div>
                  <span className={remaining > 0 ? "text-rose-600 font-medium" : "text-emerald-700 font-medium"}>{remaining > 0 ? `Owes ${money(remaining)}` : "Paid in full"}</span>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      <AttachmentsSection patient={patient} attachments={attachments} treatments={treatments} doctors={doctors} currentUser={currentUser} isAdmin={isAdmin} canEdit={canEdit} />

      {showTreatmentForm && <TreatmentForm data={showTreatmentForm} doctors={doctors} procedures={procedures} isAdmin={isAdmin} currentUser={currentUser} onCancel={() => setShowTreatmentForm(null)} onSave={saveTreatment} />}
      {confirmDeleteTreatment && (
        <Sheet title="Delete treatment record?" onClose={() => setConfirmDeleteTreatment(null)}>
          <p className="text-sm text-slate-400 mb-5">This permanently removes this treatment entry from the tooth and history.</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirmDeleteTreatment(null)} className="flex-1 py-2.5 rounded-xl border border-sky-200 text-sm font-medium text-slate-600">Cancel</button>
            <button onClick={() => deleteTreatment(confirmDeleteTreatment)} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium">Delete</button>
          </div>
        </Sheet>
      )}
    </Sheet>
  );
}

function DentalChart({ treatments, selectedTooth, onSelectTooth }) {
  function toothHasTreatment(num) { return treatments.some((t) => String(t.toothNumber) === String(num)); }
  function ToothButton({ num }) {
    const treated = toothHasTreatment(num);
    const selected = String(selectedTooth) === String(num);
    return (
      <button
        onClick={() => onSelectTooth(selected ? null : num)}
        className={`w-full aspect-square rounded-md border text-[10px] font-semibold flex items-center justify-center ${
          selected ? "border-amber-500 bg-amber-500 text-black" : treated ? "border-amber-300 bg-amber-50 text-amber-700" : "border-sky-200 bg-white text-slate-400 hover:bg-sky-50"
        }`}
      >
        {num}
      </button>
    );
  }
  return (
    <div className="bg-white border border-sky-100 rounded-xl p-3">
      <div className="grid grid-cols-16 gap-1 mb-1" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
        {FDI_UPPER.map((n) => <ToothButton key={n} num={n} />)}
      </div>
      <div className="grid grid-cols-16 gap-1" style={{ gridTemplateColumns: "repeat(16, minmax(0, 1fr))" }}>
        {FDI_LOWER.map((n) => <ToothButton key={n} num={n} />)}
      </div>
      <p className="text-[10px] text-slate-400 mt-2">FDI numbering · tap a tooth to view or add a treatment</p>
    </div>
  );
}

function TreatmentForm({ data, doctors, procedures, isAdmin, currentUser, onCancel, onSave }) {
  const [form, setForm] = useState(data);
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  const specialties = useMemo(() => [...new Set(procedures.map((p) => p.specialty))], [procedures]);
  const filteredProcedures = procedures.filter((p) => !form.specialty || p.specialty === form.specialty);
  return (
    <Sheet title={`Add treatment — Tooth ${data.toothNumber}`} onClose={onCancel}>
      <Field label="Doctor">
        {isAdmin ? (
          <select className={inputCls} value={form.doctorId} onChange={(e) => set("doctorId", e.target.value)}>
            <option value="">Select doctor…</option>
            {doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        ) : <div className="text-sm text-slate-600 py-2">{doctors.find((d) => d.id === currentUser.doctorId)?.name || "You"}</div>}
      </Field>
      <Field label="Date"><input type="date" className={inputCls} value={form.date} onChange={(e) => set("date", e.target.value)} /></Field>
      <Field label="Specialty">
        <select className={inputCls} value={form.specialty} onChange={(e) => { set("specialty", e.target.value); set("procedureId", ""); }}>
          <option value="">Select specialty…</option>
          {specialties.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </Field>
      <Field label="Procedure">
        <select className={inputCls} value={form.procedureId} onChange={(e) => set("procedureId", e.target.value)} disabled={!form.specialty}>
          <option value="">{form.specialty ? "Select procedure…" : "Select a specialty first"}</option>
          {filteredProcedures.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </Field>
      <Field label="Notes (optional)"><textarea className={inputCls} rows={2} value={form.notes} onChange={(e) => set("notes", e.target.value)} /></Field>
      <button disabled={!form.doctorId || !form.procedureId || !form.date} onClick={() => onSave(form)} className={`w-full ${btnPrimary} mt-2`}>Save treatment</button>
    </Sheet>
  );
}

function AttachmentsSection({ patient, attachments, treatments, doctors, currentUser, isAdmin, canEdit }) {
  const [busy, setBusy] = useState(false);
  const [error, setError] = useState("");
  const canUpload = isAdmin || !!currentUser.doctorId;

  async function handleFile(e) {
    const file = e.target.files[0];
    e.target.value = "";
    if (!file) return;
    setError(""); setBusy(true);
    try {
      let dataUrl;
      if (file.type.startsWith("image/")) {
        dataUrl = await compressImageFile(file);
      } else {
        dataUrl = await readFileAsDataUrl(file);
      }
      const size = dataUrlSizeBytes(dataUrl);
      if (size > MAX_ATTACHMENT_BYTES) {
        setError(`This file is too large (${Math.round(size / 1024)}KB). Please use a smaller file — under about ${Math.round(MAX_ATTACHMENT_BYTES / 1024)}KB (images are compressed automatically, PDFs are not).`);
        setBusy(false);
        return;
      }
      await db.collection("attachments").add({
        patientId: patient.id,
        doctorId: isAdmin ? (currentUser.doctorId || "admin") : currentUser.doctorId,
        uploaderName: currentUser.name,
        fileName: file.name,
        fileType: file.type || "application/octet-stream",
        dataUrl,
        size,
        uploadedAt: new Date().toISOString(),
      });
    } catch (err) {
      setError("Could not upload this file. Try a different file.");
    }
    setBusy(false);
  }

  async function del(id) { await db.collection("attachments").doc(id).delete(); }

  return (
    <div>
      <div className="flex items-center justify-between mb-2">
        <div className="text-xs font-semibold text-slate-500 uppercase tracking-wide">Attachments</div>
        {canUpload && (
          <label className={`flex items-center gap-1 text-xs font-medium text-amber-600 hover:bg-amber-50 px-2 py-1 rounded-lg cursor-pointer ${busy ? "opacity-50 pointer-events-none" : ""}`}>
            {I("upload", { size: 13 })} {busy ? "Uploading…" : "Upload file"}
            <input type="file" accept="image/*,application/pdf" className="hidden" onChange={handleFile} />
          </label>
        )}
      </div>
      <p className="text-[11px] text-slate-400 mb-2">X-rays, photos, lab reports, or PDFs. Images are auto-compressed; max file size is small since files are stored directly (no paid storage add-on).</p>
      {error && <p className="text-xs text-rose-600 mb-2">{error}</p>}
      {attachments.length === 0 && <p className="text-sm text-slate-500">No files uploaded yet.</p>}
      <div className="grid sm:grid-cols-2 gap-2">
        {attachments.map((a) => {
          const uploader = doctors.find((d) => d.id === a.doctorId);
          const isImage = a.fileType?.startsWith("image/");
          return (
            <div key={a.id} className="border border-sky-100 rounded-xl p-2.5 flex items-center gap-2.5">
              {isImage ? (
                <img src={a.dataUrl} alt={a.fileName} className="w-12 h-12 rounded-lg object-cover flex-shrink-0 border border-sky-100" />
              ) : (
                <div className="w-12 h-12 rounded-lg bg-sky-50 flex items-center justify-center flex-shrink-0 text-slate-400">{I("file", { size: 20 })}</div>
              )}
              <div className="min-w-0 flex-1">
                <div className="text-xs font-medium text-slate-700 truncate">{a.fileName}</div>
                <div className="text-[10px] text-slate-400">{a.uploadedAt?.slice(0, 10)} · {uploader?.name || a.uploaderName || "—"}</div>
              </div>
              <div className="flex gap-1 flex-shrink-0">
                <a href={a.dataUrl} download={a.fileName} className="p-1.5 rounded-lg hover:bg-sky-50 text-slate-400">{I("download", { size: 13 })}</a>
                {canEdit(a.doctorId) && <button onClick={() => del(a.id)} className="p-1.5 rounded-lg hover:bg-sky-50 text-rose-600">{I("trash", { size: 13 })}</button>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

// ---------- Calendar ----------
function CalendarTab({ doctors, appointments, availability, procedures, patients, currentUser, isAdmin, canEdit }) {
  const today = new Date();
  const [viewYear, setViewYear] = useState(today.getFullYear());
  const [viewMonth, setViewMonth] = useState(today.getMonth());
  const [selectedDate, setSelectedDate] = useState(todayStr());
  const [showApptForm, setShowApptForm] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const cells = useMemo(() => {
    const firstDay = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const arr = [];
    for (let i = 0; i < firstDay; i++) arr.push(null);
    for (let d = 1; d <= daysInMonth; d++) arr.push(d);
    return arr;
  }, [viewYear, viewMonth]);

  function apptsFor(dateStr) { return appointments.filter((a) => a.date === dateStr).sort((a, b) => (a.time || "").localeCompare(b.time || "")); }
  function presentDoctorsFor(dateStr) { return doctors.filter((doc) => isDoctorPresent(doc, dateStr, availability)); }

  function changeMonth(delta) {
    let m = viewMonth + delta, y = viewYear;
    if (m < 0) { m = 11; y -= 1; } else if (m > 11) { m = 0; y += 1; }
    setViewMonth(m); setViewYear(y);
  }

  async function setAvailabilityStatus(doctorId, status) {
    const existing = availability.find((av) => av.date === selectedDate && av.doctorId === doctorId);
    if (existing) await db.collection("availability").doc(existing.id).update({ status });
    else await db.collection("availability").add({ date: selectedDate, doctorId, status });
  }
  async function saveAppointment(data) {
    if (data.id) { const { id, ...rest } = data; await db.collection("appointments").doc(id).update(rest); }
    else await db.collection("appointments").add(data);
    setShowApptForm(null);
  }
  async function deleteAppointment(id) { await db.collection("appointments").doc(id).delete(); setConfirmDelete(null); }

  const dayAppts = apptsFor(selectedDate);

  return (
    <div className="grid lg:grid-cols-3 gap-5">
      <div className="lg:col-span-2 bg-white rounded-2xl border border-sky-100 p-4 sm:p-5">
        <div className="flex items-center justify-between mb-4">
          <h2 className="font-display text-lg text-slate-800">{MONTH_NAMES[viewMonth]} {viewYear}</h2>
          <div className="flex items-center gap-1">
            <button onClick={() => { setViewMonth(today.getMonth()); setViewYear(today.getFullYear()); setSelectedDate(todayStr()); }} className="text-xs font-medium text-amber-600 px-2.5 py-1.5 rounded-lg hover:bg-amber-50 mr-1">Today</button>
            <button onClick={() => changeMonth(-1)} className="p-1.5 rounded-lg hover:bg-sky-50 text-slate-400">{I("chevLeft", { size: 18 })}</button>
            <button onClick={() => changeMonth(1)} className="p-1.5 rounded-lg hover:bg-sky-50 text-slate-400">{I("chevRight", { size: 18 })}</button>
          </div>
        </div>
        <div className="grid grid-cols-7 gap-1 mb-1">{WEEKDAY_LABELS.map((w) => <div key={w} className="text-center text-[11px] font-medium text-slate-500 py-1">{w}</div>)}</div>
        <div className="grid grid-cols-7 gap-1">
          {cells.map((d, i) => {
            if (!d) return <div key={i} />;
            const dateStr = toDateStr(viewYear, viewMonth, d);
            const isSelected = dateStr === selectedDate;
            const isToday = dateStr === todayStr();
            const present = presentDoctorsFor(dateStr);
            const apptCount = appointments.filter((a) => a.date === dateStr).length;
            return (
              <button key={i} onClick={() => setSelectedDate(dateStr)}
                className={`aspect-square rounded-xl p-1.5 flex flex-col items-center justify-start border ${isSelected ? "border-amber-500 bg-amber-50" : isToday ? "border-sky-400 bg-sky-50" : "border-transparent hover:bg-sky-50"}`}>
                <span className={`text-xs font-medium ${isSelected ? "text-amber-700" : "text-slate-600"}`}>{d}</span>
                <div className="flex gap-0.5 mt-1 flex-wrap justify-center">
                  {present.slice(0, 4).map((doc) => <span key={doc.id} className={`w-1.5 h-1.5 rounded-full ${colorFor(doctors, doc.id).dot}`} />)}
                </div>
                {apptCount > 0 && <span className="text-[9px] text-slate-500 mt-0.5">{apptCount} visit{apptCount > 1 ? "s" : ""}</span>}
              </button>
            );
          })}
        </div>
        <div className="flex flex-wrap gap-3 mt-4 pt-4 border-t border-sky-100">
          {doctors.map((doc) => <div key={doc.id} className="flex items-center gap-1.5 text-xs text-slate-400"><span className={`w-2 h-2 rounded-full ${colorFor(doctors, doc.id).dot}`} /> {doc.name}</div>)}
          {doctors.length === 0 && <p className="text-xs text-slate-500">Add doctors from the Doctors tab to see them on the calendar.</p>}
        </div>
      </div>

      <div className="bg-white rounded-2xl border border-sky-100 p-4 sm:p-5 h-fit lg:sticky lg:top-20">
        <h3 className="font-display text-base text-slate-800 mb-1">{formatLongDate(selectedDate)}</h3>
        <p className="text-xs text-slate-500 mb-4">Mark who's in today and manage visits.</p>

        <div className="mb-5">
          <div className="text-xs font-semibold text-slate-400 mb-2 uppercase tracking-wide">Doctors today</div>
          {doctors.length === 0 && <p className="text-sm text-slate-500">No doctors added yet.</p>}
          <div className="space-y-2">
            {doctors.map((doc) => {
              const status = doctorStatusFor(doc, selectedDate, availability);
              const editable = canEdit(doc.id);
              return (
                <div key={doc.id} className="flex items-center justify-between gap-2">
                  <div className="flex items-center gap-2 min-w-0"><span className={`w-2 h-2 rounded-full flex-shrink-0 ${colorFor(doctors, doc.id).dot}`} /><span className="text-sm text-slate-700 truncate">{doc.name}</span></div>
                  <div className="flex gap-1 flex-shrink-0">
                    <button disabled={!editable} onClick={() => setAvailabilityStatus(doc.id, "present")} className={`text-[11px] px-2 py-1 rounded-md font-medium border ${status === "present" ? "bg-emerald-500 text-white border-emerald-500" : "border-sky-200 text-slate-500"} ${!editable ? "opacity-50" : "hover:border-emerald-400"}`}>In</button>
                    <button disabled={!editable} onClick={() => setAvailabilityStatus(doc.id, "off")} className={`text-[11px] px-2 py-1 rounded-md font-medium border ${status === "off" ? "bg-rose-500 text-white border-rose-500" : "border-sky-200 text-slate-500"} ${!editable ? "opacity-50" : "hover:border-rose-400"}`}>Off</button>
                  </div>
                </div>
              );
            })}
          </div>
        </div>

        <div>
          <div className="flex items-center justify-between mb-2">
            <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide">Appointments</div>
            <button onClick={() => setShowApptForm({ date: selectedDate, doctorId: isAdmin ? "" : currentUser.doctorId, time: "", patientName: "", phone: "", status: "scheduled", specialty: "", procedureId: "", notes: "" })} className="flex items-center gap-1 text-xs font-medium text-amber-600 hover:bg-amber-50 px-2 py-1 rounded-lg">{I("plus", { size: 14 })} Add</button>
          </div>
          {dayAppts.length === 0 && <p className="text-sm text-slate-500">No appointments for this day yet.</p>}
          <div className="space-y-2">
            {dayAppts.map((a) => {
              const doc = doctors.find((d) => d.id === a.doctorId);
              const proc = procedures.find((p) => p.id === a.procedureId);
              const c = colorFor(doctors, a.doctorId);
              const editable = canEdit(a.doctorId);
              const statusPill = { scheduled: "bg-sky-50 text-sky-700", done: "bg-emerald-50 text-emerald-700", cancelled: "bg-rose-50 text-rose-700" }[a.status] || "bg-sky-50 text-slate-400";
              return (
                <div key={a.id} className={`border rounded-xl p-3 ${c.chip}`}>
                  <div className="flex items-start justify-between gap-2">
                    <div className="min-w-0">
                      <div className="flex items-center gap-1.5 text-xs text-slate-400 mb-0.5">{I("clock", { size: 12 })} {a.time || "—"} <span className={`px-1.5 py-0.5 rounded-full ${statusPill} ml-1`}>{a.status}</span></div>
                      <div className="text-sm font-medium text-slate-800 truncate">{a.patientName}</div>
                      <div className="text-xs text-slate-400 flex items-center gap-1">{a.phone && <>{I("phone", { size: 11 })} {a.phone}</>}</div>
                      <div className={`text-[11px] mt-1 inline-block px-1.5 py-0.5 rounded-full border ${c.chip}`}>{doc ? doc.name : "Unknown doctor"}</div>
                      {proc && <div className="text-[11px] mt-1 ml-1 inline-block px-1.5 py-0.5 rounded-full border border-amber-200 bg-amber-50 text-amber-700">{proc.specialty} · {proc.name}</div>}
                      {a.notes && <div className="text-xs text-slate-400 mt-1">{a.notes}</div>}
                    </div>
                    {editable && (
                      <div className="flex flex-col gap-1 flex-shrink-0">
                        <button onClick={() => setShowApptForm(a)} className="p-1.5 rounded-lg hover:bg-white/60 text-slate-400">{I("pencil", { size: 14 })}</button>
                        <button onClick={() => setConfirmDelete(a.id)} className="p-1.5 rounded-lg hover:bg-white/60 text-rose-600">{I("trash", { size: 14 })}</button>
                      </div>
                    )}
                  </div>
                </div>
              );
            })}
          </div>
        </div>
      </div>

      {showApptForm && <AppointmentForm doctors={doctors} procedures={procedures} patients={patients} data={showApptForm} isAdmin={isAdmin} currentUser={currentUser} onCancel={() => setShowApptForm(null)} onSave={saveAppointment} />}
      {confirmDelete && (
        <Sheet title="Delete appointment?" onClose={() => setConfirmDelete(null)}>
          <p className="text-sm text-slate-400 mb-5">This will permanently remove the appointment record.</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirmDelete(null)} className="flex-1 py-2.5 rounded-xl border border-sky-200 text-sm font-medium text-slate-600">Cancel</button>
            <button onClick={() => deleteAppointment(confirmDelete)} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium">Delete</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

function AppointmentForm({ doctors, procedures, patients, data, isAdmin, currentUser, onCancel, onSave }) {
  const [form, setForm] = useState({ specialty: "", procedureId: "", ...data });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  const specialties = useMemo(() => [...new Set(procedures.map((p) => p.specialty))], [procedures]);
  const filteredProcedures = procedures.filter((p) => !form.specialty || p.specialty === form.specialty);
  return (
    <Sheet title={data.id ? "Edit appointment" : "New appointment"} onClose={onCancel}>
      <Field label="Doctor">
        {isAdmin ? (
          <select className={inputCls} value={form.doctorId} onChange={(e) => set("doctorId", e.target.value)}>
            <option value="">Select doctor…</option>
            {doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}
          </select>
        ) : <div className="text-sm text-slate-600 py-2">{doctors.find((d) => d.id === currentUser.doctorId)?.name || "You"}</div>}
      </Field>
      <Field label="Time"><input type="time" className={inputCls} value={form.time} onChange={(e) => set("time", e.target.value)} /></Field>
      <Field label="Patient name">
        <input list="patient-names" className={inputCls} value={form.patientName} onChange={(e) => set("patientName", e.target.value)} />
        <datalist id="patient-names">{patients.map((p) => <option key={p.id} value={p.name} />)}</datalist>
      </Field>
      <Field label="Phone"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
      <Field label="Specialty">
        <select className={inputCls} value={form.specialty} onChange={(e) => { set("specialty", e.target.value); set("procedureId", ""); }}>
          <option value="">Select specialty…</option>
          {specialties.map((s) => <option key={s} value={s}>{s}</option>)}
        </select>
      </Field>
      <Field label="Procedure">
        <select className={inputCls} value={form.procedureId} onChange={(e) => set("procedureId", e.target.value)} disabled={!form.specialty}>
          <option value="">{form.specialty ? "Select procedure…" : "Select a specialty first"}</option>
          {filteredProcedures.map((p) => <option key={p.id} value={p.id}>{p.name}</option>)}
        </select>
      </Field>
      <Field label="Status">
        <select className={inputCls} value={form.status} onChange={(e) => set("status", e.target.value)}>
          <option value="scheduled">Scheduled</option><option value="done">Done</option><option value="cancelled">Cancelled</option>
        </select>
      </Field>
      <Field label="Notes"><textarea className={inputCls} rows={2} value={form.notes} onChange={(e) => set("notes", e.target.value)} /></Field>
      <button disabled={!form.doctorId || !form.patientName} onClick={() => onSave(form)} className={`w-full ${btnPrimary} mt-2`}>Save appointment</button>
    </Sheet>
  );
}

// ---------- Procedures catalog ----------
function ProceduresTab({ procedures, isAdmin }) {
  const [showForm, setShowForm] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const specialties = useMemo(() => [...new Set(procedures.map((p) => p.specialty))].sort(), [procedures]);

  async function save(form) {
    if (form.id) { const { id, ...rest } = form; await db.collection("procedures").doc(id).update(rest); }
    else await db.collection("procedures").add({ specialty: form.specialty, name: form.name });
    setShowForm(null);
  }
  async function del(id) { await db.collection("procedures").doc(id).delete(); setConfirmDelete(null); }

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <div>
          <h2 className="font-display text-lg text-slate-800">Dental procedures</h2>
          <p className="text-xs text-slate-500">Catalog of procedures by specialty, used when logging an appointment.</p>
        </div>
        {isAdmin && <button onClick={() => setShowForm({ specialty: "", name: "" })} className="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-black text-sm font-semibold px-3.5 py-2 rounded-xl">{I("plus", { size: 16 })} Add</button>}
      </div>
      {procedures.length === 0 && <div className="bg-white rounded-2xl border border-sky-100 p-8 text-center text-slate-500 text-sm">No procedures in the catalog yet.</div>}
      <div className="space-y-5">
        {specialties.map((spec) => (
          <div key={spec} className="bg-white rounded-2xl border border-sky-100 overflow-hidden">
            <div className="px-4 py-2.5 bg-amber-50 border-b border-sky-100 text-amber-700 text-sm font-semibold">{spec}</div>
            <div className="divide-y divide-sky-100">
              {procedures.filter((p) => p.specialty === spec).map((p) => (
                <div key={p.id} className="flex items-center justify-between px-4 py-2.5">
                  <span className="text-sm text-slate-700">{p.name}</span>
                  {isAdmin && (
                    <div className="flex gap-1">
                      <button onClick={() => setShowForm(p)} className="p-1.5 rounded-lg hover:bg-sky-50 text-slate-400">{I("pencil", { size: 13 })}</button>
                      <button onClick={() => setConfirmDelete(p.id)} className="p-1.5 rounded-lg hover:bg-sky-50 text-rose-600">{I("trash", { size: 13 })}</button>
                    </div>
                  )}
                </div>
              ))}

          </div>
        ))}
      </div>
      {showForm && <ProcedureForm data={showForm} specialties={specialties} onCancel={() => setShowForm(null)} onSave={save} />}
