        <Sheet title="Delete procedure?" onClose={() => setConfirmDelete(null)}>
          <p className="text-sm text-slate-400 mb-5">This removes it from the catalog. Past appointments that used it keep their record.</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirmDelete(null)} className="flex-1 py-2.5 rounded-xl border border-sky-200 text-sm font-medium text-slate-600">Cancel</button>
            <button onClick={() => del(confirmDelete)} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium">Delete</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

function ProcedureForm({ data, specialties, onCancel, onSave }) {
  const [form, setForm] = useState(data);
  const [customSpecialty, setCustomSpecialty] = useState(!specialties.includes(data.specialty) && !!data.specialty);
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  return (
    <Sheet title={data.id ? "Edit procedure" : "Add procedure"} onClose={onCancel}>
      <Field label="Specialty">
        {!customSpecialty ? (
          <select className={inputCls} value={form.specialty} onChange={(e) => { if (e.target.value === "__new__") { setCustomSpecialty(true); set("specialty", ""); } else set("specialty", e.target.value); }}>
            <option value="">Select specialty…</option>
            {specialties.map((s) => <option key={s} value={s}>{s}</option>)}
            <option value="__new__">+ New specialty…</option>
          </select>
        ) : (
          <input className={inputCls} placeholder="Type new specialty name" value={form.specialty} onChange={(e) => set("specialty", e.target.value)} />
        )}
      </Field>
      <Field label="Procedure name"><input className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
      <button disabled={!form.specialty || !form.name} onClick={() => onSave(form)} className={`w-full ${btnPrimary} mt-2`}>Save procedure</button>
    </Sheet>
  );
}

// ---------- Doctors ----------
function DoctorsTab({ doctors, users, patients, isAdmin }) {
  const [showForm, setShowForm] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);
  const [busy, setBusy] = useState(false);
  const [formError, setFormError] = useState("");

  async function saveDoctor(form) {
    setFormError(""); setBusy(true);
    try {
      if (form.id) {
        await db.collection("doctors").doc(form.id).update({ name: form.name, specialty: form.specialty, phone: form.phone, workingDays: form.workingDays || [] });
        const u = users.find((x) => x.doctorId === form.id);
        if (u) await db.collection("users").doc(u.id).update({ name: form.name });
      } else {
        const docRef = await db.collection("doctors").add({ name: form.name, specialty: form.specialty, phone: form.phone, workingDays: form.workingDays || [] });
        const secondaryApp = firebase.initializeApp(firebaseConfig, "Secondary" + Date.now());
        try {
          const cred = await secondaryApp.auth().createUserWithEmailAndPassword(form.email.trim(), form.password);
          const uid = cred.user.uid;
          await secondaryApp.auth().signOut();
          await db.collection("users").doc(uid).set({ role: "doctor", doctorId: docRef.id, name: form.name, email: form.email.trim() });
        } finally {
          await secondaryApp.delete();
        }
      }
      setShowForm(null);
    } catch (e) {
      setFormError(e.message || "Could not save doctor.");
    }
    setBusy(false);
  }
  async function deleteDoctor(id) {
    await db.collection("doctors").doc(id).delete();
    const u = users.find((x) => x.doctorId === id);
    if (u) await db.collection("users").doc(u.id).delete();
    setConfirmDelete(null);
  }

  return (
    <div>
      <div className="flex items-center justify-between mb-4">
        <h2 className="font-display text-lg text-slate-800">Doctors</h2>
        {isAdmin && <button onClick={() => setShowForm({})} className="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-black text-sm font-semibold px-3.5 py-2 rounded-xl">{I("plus", { size: 16 })} Add doctor</button>}
      </div>
      {doctors.length === 0 && <div className="bg-white rounded-2xl border border-sky-100 p-8 text-center text-slate-500 text-sm">No doctors yet. {isAdmin ? "Add your first doctor to get started." : "Ask the administrator to add doctors."}</div>}
      <div className="grid sm:grid-cols-2 lg:grid-cols-3 gap-3">
        {doctors.map((d) => {
          const c = colorFor(doctors, d.id);
          const u = users.find((x) => x.doctorId === d.id);
          const docPatients = patients.filter((p) => p.doctorId === d.id);
          return (
            <div key={d.id} className="bg-white rounded-2xl border border-sky-100 p-4">
              <div className="flex items-start justify-between">
                <div className="flex items-center gap-2.5">
                  <span className={`w-9 h-9 rounded-full flex items-center justify-center text-black text-sm font-semibold ${c.dot}`}>{d.name?.[0]?.toUpperCase() || "?"}</span>
                  <div><div className="text-sm font-semibold text-slate-800">{d.name}</div><div className="text-xs text-slate-500">{d.specialty || "General"}</div></div>
                </div>
                {isAdmin && (
                  <div className="flex gap-1">
                    <button onClick={() => setShowForm({ ...d })} className="p-1.5 rounded-lg hover:bg-sky-50 text-slate-400">{I("pencil", { size: 14 })}</button>
                    <button onClick={() => setConfirmDelete(d.id)} className="p-1.5 rounded-lg hover:bg-sky-50 text-rose-600">{I("trash", { size: 14 })}</button>
                  </div>
                )}
              </div>
              <div className="mt-3 text-xs text-slate-500 space-y-0.5">
                {d.phone && <div>{d.phone}</div>}
                {u && isAdmin && <div className="text-slate-600">Login: {u.email}</div>}
              </div>
              <div className="mt-3 pt-3 border-t border-sky-100">
                <div className="text-[11px] font-semibold text-slate-500 uppercase tracking-wide mb-1.5">{docPatients.length} patient{docPatients.length !== 1 ? "s" : ""} assigned</div>
                {docPatients.length === 0 && <p className="text-xs text-slate-400">No patients assigned yet.</p>}
                <div className="flex flex-wrap gap-1">
                  {docPatients.slice(0, 8).map((p) => (
                    <span key={p.id} className="text-[11px] px-2 py-0.5 rounded-full bg-sky-50 border border-sky-100 text-slate-600">{p.name}</span>
                  ))}
                  {docPatients.length > 8 && <span className="text-[11px] px-2 py-0.5 text-slate-400">+{docPatients.length - 8} more</span>}
                </div>
              </div>
            </div>
          );
        })}
      </div>
      {showForm && <DoctorForm data={showForm} busy={busy} error={formError} onCancel={() => setShowForm(null)} onSave={saveDoctor} />}
      {confirmDelete && (
        <Sheet title="Remove doctor?" onClose={() => setConfirmDelete(null)}>
          <p className="text-sm text-slate-400 mb-5">This removes the doctor record and their login profile. Their existing appointments and payments remain on record. (Their sign-in account itself must also be deleted from the Firebase console under Authentication.)</p>
          <div className="flex gap-2">
            <button onClick={() => setConfirmDelete(null)} className="flex-1 py-2.5 rounded-xl border border-sky-200 text-sm font-medium text-slate-600">Cancel</button>
            <button onClick={() => deleteDoctor(confirmDelete)} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium">Remove</button>
          </div>
        </Sheet>
      )}
    </div>
  );
}

function DoctorForm({ data, busy, error, onCancel, onSave }) {
  const [form, setForm] = useState({ name: "", specialty: "", phone: "", email: "", password: "", workingDays: [0, 1, 2, 3, 4, 5, 6], ...data });
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  function toggleDay(idx) {
    setForm((f) => {
      const days = f.workingDays || [];
      return { ...f, workingDays: days.includes(idx) ? days.filter((d) => d !== idx) : [...days, idx].sort() };
    });
  }
  const isEdit = !!data.id;
  return (
    <Sheet title={isEdit ? "Edit doctor" : "Add doctor"} onClose={onCancel}>
      <Field label="Full name"><input className={inputCls} value={form.name} onChange={(e) => set("name", e.target.value)} /></Field>
      <Field label="Specialty"><input className={inputCls} value={form.specialty} onChange={(e) => set("specialty", e.target.value)} /></Field>
      <Field label="Phone"><input className={inputCls} value={form.phone} onChange={(e) => set("phone", e.target.value)} /></Field>
      <Field label="Working days (weekly schedule)">
        <div className="flex flex-wrap gap-1.5">
          {WEEKDAY_LABELS.map((w, idx) => {
            const on = (form.workingDays || []).includes(idx);
            return (
              <button key={w} type="button" onClick={() => toggleDay(idx)} className={`px-2.5 py-1.5 rounded-lg text-xs font-medium border ${on ? "bg-amber-500 border-amber-500 text-black" : "border-sky-200 text-slate-500"}`}>{w}</button>
            );
          })}
        </div>
        <p className="text-[11px] text-slate-400 mt-1.5">The calendar shows this doctor as "in" automatically on these days. You can still override any single day from the Calendar tab.</p>
      </Field>
      {!isEdit && (
        <>
          <Field label="Doctor's email (used to sign in)"><input type="email" className={inputCls} value={form.email} onChange={(e) => set("email", e.target.value)} /></Field>
          <Field label="Temporary password (share with the doctor)"><input className={inputCls} value={form.password} onChange={(e) => set("password", e.target.value)} /></Field>
          <p className="text-xs text-slate-500 -mt-2 mb-4">The doctor can change this password themselves later, or use "Forgot password" on the login screen.</p>
        </>
      )}
      {error && <p className="text-rose-600 text-sm mb-3">{error}</p>}
      <button disabled={busy || !form.name || (!isEdit && (!form.email || !form.password))} onClick={() => onSave(form)} className={`w-full ${btnPrimary} mt-2`}>
        {busy ? "Saving…" : "Save doctor"}
      </button>
    </Sheet>
  );
}

// ---------- Payments ----------
function PaymentsTab({ doctors, payments, patients, currentUser, isAdmin, canEdit }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const [doctorFilter, setDoctorFilter] = useState("all");
  const [showForm, setShowForm] = useState(null);
  const [confirmDelete, setConfirmDelete] = useState(null);

  const ym = `${year}-${pad(month + 1)}`;
  const visible = payments.filter((p) => {
    if (!p.date.startsWith(ym)) return false;
    if (!isAdmin && p.doctorId !== currentUser.doctorId) return false;
    if (isAdmin && doctorFilter !== "all" && p.doctorId !== doctorFilter) return false;
    return true;
  }).sort((a, b) => b.date.localeCompare(a.date));
  const totalPaid = visible.reduce((s, p) => s + Number(p.paidAmount || 0), 0);
  const totalRemaining = visible.reduce((s, p) => s + Math.max(0, Number(p.totalCost || 0) - Number(p.paidAmount || 0)), 0);

  async function save(form) {
    if (form.id) { const { id, ...rest } = form; await db.collection("payments").doc(id).update(rest); }
    else await db.collection("payments").add(form);
    setShowForm(null);
  }
  async function del(id) { await db.collection("payments").doc(id).delete(); setConfirmDelete(null); }

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="font-display text-lg text-slate-800">Payments</h2>
        <button onClick={() => setShowForm({ date: todayStr(), doctorId: isAdmin ? (doctorFilter !== "all" ? doctorFilter : "") : currentUser.doctorId, patientName: "", totalCost: "", paidAmount: "", notes: "" })} className="flex items-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-black text-sm font-semibold px-3.5 py-2 rounded-xl">{I("plus", { size: 16 })} Add payment</button>
      </div>
      <div className="flex flex-wrap gap-2 mb-4">
        <select className="rounded-xl border border-sky-200 bg-sky-50 text-slate-800 px-3 py-2 text-sm" value={month} onChange={(e) => setMonth(Number(e.target.value))}>{MONTH_NAMES.map((m, i) => <option key={m} value={i}>{m}</option>)}</select>
        <select className="rounded-xl border border-sky-200 bg-sky-50 text-slate-800 px-3 py-2 text-sm" value={year} onChange={(e) => setYear(Number(e.target.value))}>{[year - 1, year, year + 1].map((y) => <option key={y} value={y}>{y}</option>)}</select>
        {isAdmin && <select className="rounded-xl border border-sky-200 bg-sky-50 text-slate-800 px-3 py-2 text-sm" value={doctorFilter} onChange={(e) => setDoctorFilter(e.target.value)}><option value="all">All doctors</option>{doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}</select>}
      </div>
      <div className="bg-white rounded-2xl border border-sky-100 overflow-hidden">
        <div className="flex items-center justify-between px-4 py-3 bg-sky-50/50 border-b border-sky-100">
          <span className="text-xs font-semibold text-slate-400 uppercase tracking-wide">{visible.length} payment{visible.length !== 1 ? "s" : ""}</span>
          <div className="text-right">
            <div className="text-sm font-semibold text-emerald-600">Paid: {money(totalPaid)}</div>
            {totalRemaining > 0 && <div className="text-xs font-medium text-rose-600">Remaining: {money(totalRemaining)}</div>}
          </div>
        </div>
        {visible.length === 0 && <div className="p-6 text-center text-sm text-slate-500">No payments recorded for this month yet.</div>}
        <div className="divide-y divide-sky-100">
          {visible.map((p) => {
            const doc = doctors.find((d) => d.id === p.doctorId);
            const editable = canEdit(p.doctorId);
            const remaining = Math.max(0, Number(p.totalCost || 0) - Number(p.paidAmount || 0));
            return (
              <div key={p.id} className="flex items-center justify-between px-4 py-3 gap-2">
                <div className="min-w-0"><div className="text-sm font-medium text-slate-800 truncate">{p.patientName}</div><div className="text-xs text-slate-500">{p.date}{doc ? ` · ${doc.name}` : ""}{p.notes ? ` · ${p.notes}` : ""}</div></div>
                <div className="flex items-center gap-2 flex-shrink-0">
                  <div className="text-right">
                    <div className="text-sm font-semibold text-emerald-700">Paid {money(p.paidAmount)}</div>
                    {remaining > 0 ? <div className="text-[11px] text-rose-600">Remaining {money(remaining)}</div> : <div className="text-[11px] text-slate-400">of {money(p.totalCost)}</div>}
                  </div>
                  {editable && <><button onClick={() => setShowForm(p)} className="p-1.5 rounded-lg hover:bg-sky-50 text-slate-400">{I("pencil", { size: 14 })}</button><button onClick={() => setConfirmDelete(p.id)} className="p-1.5 rounded-lg hover:bg-sky-50 text-rose-600">{I("trash", { size: 14 })}</button></>}
                </div>
              </div>
            );
          })}
        </div>
      </div>
      {showForm && <PaymentForm doctors={doctors} patients={patients} data={showForm} isAdmin={isAdmin} currentUser={currentUser} onCancel={() => setShowForm(null)} onSave={save} />}
      {confirmDelete && (
        <Sheet title="Delete payment?" onClose={() => setConfirmDelete(null)}>
          <p className="text-sm text-slate-400 mb-5">This will permanently remove the payment record.</p>
          <div className="flex gap-2"><button onClick={() => setConfirmDelete(null)} className="flex-1 py-2.5 rounded-xl border border-sky-200 text-sm font-medium text-slate-600">Cancel</button><button onClick={() => del(confirmDelete)} className="flex-1 py-2.5 rounded-xl bg-rose-600 hover:bg-rose-500 text-white text-sm font-medium">Delete</button></div>
        </Sheet>
      )}
    </div>
  );
}

function PaymentForm({ doctors, patients, data, isAdmin, currentUser, onCancel, onSave }) {
  const [form, setForm] = useState(data);
  const [manualEntry, setManualEntry] = useState(!data.patientId && !!data.patientName);
  function set(k, v) { setForm((f) => ({ ...f, [k]: v })); }
  function pickPatient(patientId) {
    if (patientId === "__manual__") { setManualEntry(true); set("patientId", ""); return; }
    const p = patients.find((x) => x.id === patientId);
    if (!p) return;
    setForm((f) => ({ ...f, patientId: p.id, patientName: p.name, doctorId: isAdmin ? (p.doctorId || f.doctorId) : f.doctorId }));
  }
  const remaining = Math.max(0, Number(form.totalCost || 0) - Number(form.paidAmount || 0));
  const sortedPatients = [...patients].sort((a, b) => (a.name || "").localeCompare(b.name || ""));
  return (
    <Sheet title={data.id ? "Edit payment" : "New payment"} onClose={onCancel}>
      <Field label="Patient">
        {!manualEntry ? (
          <select className={inputCls} value={form.patientId || ""} onChange={(e) => pickPatient(e.target.value)}>
            <option value="">Select a registered patient…</option>
            {sortedPatients.map((p) => <option key={p.id} value={p.id}>{p.name}{p.phone ? ` — ${p.phone}` : ""}</option>)}
            <option value="__manual__">✏️ Not registered — type name manually</option>
          </select>
        ) : (
          <div className="flex gap-2">
            <input className={inputCls} placeholder="Patient name" value={form.patientName} onChange={(e) => set("patientName", e.target.value)} />
            <button type="button" onClick={() => { setManualEntry(false); set("patientName", ""); set("patientId", ""); }} className="px-3 rounded-xl border border-sky-200 text-xs text-slate-500 flex-shrink-0">List</button>
          </div>
        )}
        {!manualEntry && form.patientId && <p className="text-[11px] text-emerald-600 mt-1.5">Doctor filled in automatically from this patient's record.</p>}
      </Field>
      <Field label="Doctor">
        {isAdmin ? (
          <select className={inputCls} value={form.doctorId} onChange={(e) => set("doctorId", e.target.value)}><option value="">Select doctor…</option>{doctors.map((d) => <option key={d.id} value={d.id}>{d.name}</option>)}</select>
        ) : <div className="text-sm text-slate-600 py-2">{doctors.find((d) => d.id === currentUser.doctorId)?.name || "You"}</div>}
      </Field>
      <Field label="Date"><input type="date" className={inputCls} value={form.date} onChange={(e) => set("date", e.target.value)} /></Field>
      <div className="grid grid-cols-2 gap-3">
        <Field label="Total cost (EGP)"><input type="number" className={inputCls} value={form.totalCost} onChange={(e) => set("totalCost", e.target.value)} /></Field>
        <Field label="Paid so far (EGP)"><input type="number" className={inputCls} value={form.paidAmount} onChange={(e) => set("paidAmount", e.target.value)} /></Field>
      </div>
      <div className={`text-sm font-medium mb-4 -mt-2 ${remaining > 0 ? "text-rose-600" : "text-emerald-600"}`}>
        {remaining > 0 ? `Remaining: ${money(remaining)}` : "Fully paid"}
      </div>
      <Field label="Notes"><textarea className={inputCls} rows={2} value={form.notes} onChange={(e) => set("notes", e.target.value)} /></Field>
      <button disabled={!form.doctorId || !form.patientName || !form.totalCost || !form.date} onClick={() => onSave(form)} className={`w-full ${btnPrimary} mt-2`}>Save payment</button>
    </Sheet>
  );
}

// ---------- Reports ----------
function ReportsTab({ doctors, appointments, payments, procedures, treatments, patients, currentUser, isAdmin }) {
  const now = new Date();
  const [year, setYear] = useState(now.getFullYear());
  const [month, setMonth] = useState(now.getMonth());
  const ym = `${year}-${pad(month + 1)}`;

  function statsFor(doctorId) {
    const apps = appointments.filter((a) => a.date.startsWith(ym) && a.doctorId === doctorId);
    const pays = payments.filter((p) => p.date.startsWith(ym) && p.doctorId === doctorId);
    const doctorTreatments = treatments.filter((t) => t.date && t.date.startsWith(ym) && t.doctorId === doctorId);
    const cases = new Set(doctorTreatments.map((t) => t.patientId)).size;
    const completedProcedures = doctorTreatments.filter((t) => {
      const patient = patients.find((p) => p.id === t.patientId);
      return isTreatmentCompleted(t, patient, appointments, payments);
    }).length;
    return { totalVisits: apps.length, completedVisits: apps.filter((a) => a.status === "done").length, totalPayments: pays.reduce((s, p) => s + Number(p.paidAmount || 0), 0), cases, completedProcedures };
  }
  function procedureBreakdownFor(doctorId) {
    const map = {};
    treatments.filter((t) => t.date && t.date.startsWith(ym) && t.doctorId === doctorId).forEach((t) => {
      const proc = procedures.find((p) => p.id === t.procedureId);
      if (!proc) return;
      const patient = patients.find((p) => p.id === t.patientId);
      const completed = isTreatmentCompleted(t, patient, appointments, payments);
      const key = proc.name;
      if (!map[key]) map[key] = { total: 0, completed: 0 };
      map[key].total += 1;
      if (completed) map[key].completed += 1;
    });
    return Object.entries(map).sort((a, b) => b[1].total - a[1].total);
  }

  function downloadCsv() {
    const rows = [["Doctor", "Total Visits", "Completed Visits", "Cases", "Completed Procedures", "Total Payments (EGP)"]];
    let gv = 0, gc = 0, gt = 0;
    doctors.forEach((d) => { const s = statsFor(d.id); rows.push([d.name, s.totalVisits, s.completedVisits, s.cases, s.completedProcedures, s.totalPayments]); gv += s.totalVisits; gc += s.completedVisits; gt += s.totalPayments; });
    rows.push(["TOTAL", gv, gc, "", "", gt]);
    rows.push([]);
    rows.push(["Doctor", "Procedure", "Completed", "Total"]);
    doctors.forEach((d) => { procedureBreakdownFor(d.id).forEach(([name, v]) => rows.push([d.name, name, v.completed, v.total])); });
    const csv = rows.map((r) => r.join(",")).join("\n");
    const blob = new Blob([csv], { type: "text/csv" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = `al-galaa-clinic-report-${ym}.csv`; a.click(); URL.revokeObjectURL(url);
  }

  return (
    <div>
      <div className="flex flex-wrap items-center justify-between gap-3 mb-4">
        <h2 className="font-display text-lg text-slate-800">Monthly report</h2>
        <div className="flex gap-2">
          <select className="rounded-xl border border-sky-200 bg-sky-50 text-slate-800 px-3 py-2 text-sm" value={month} onChange={(e) => setMonth(Number(e.target.value))}>{MONTH_NAMES.map((m, i) => <option key={m} value={i}>{m}</option>)}</select>
          <select className="rounded-xl border border-sky-200 bg-sky-50 text-slate-800 px-3 py-2 text-sm" value={year} onChange={(e) => setYear(Number(e.target.value))}>{[year - 1, year, year + 1].map((y) => <option key={y} value={y}>{y}</option>)}</select>
          {isAdmin && <button onClick={downloadCsv} className="flex items-center gap-1.5 border border-amber-200 text-amber-600 text-sm font-medium px-3 py-2 rounded-xl hover:bg-amber-50">{I("download", { size: 15 })} CSV</button>}
        </div>
      </div>
      {isAdmin ? (
        <div className="bg-white rounded-2xl border border-sky-100 overflow-hidden mb-5">
          <table className="w-full text-sm">
            <thead><tr className="bg-sky-50/50 text-slate-400 text-xs uppercase tracking-wide"><th className="text-left font-semibold px-4 py-3">Doctor</th><th className="text-right font-semibold px-4 py-3">Visits</th><th className="text-right font-semibold px-4 py-3">Completed</th><th className="text-right font-semibold px-4 py-3">Cases</th><th className="text-right font-semibold px-4 py-3">Completed Procedures</th><th className="text-right font-semibold px-4 py-3">Payments</th></tr></thead>
            <tbody className="divide-y divide-sky-100">
              {doctors.map((d) => { const s = statsFor(d.id); return (
                <tr key={d.id}>
                  <td className="px-4 py-3 flex items-center gap-2 text-slate-700"><span className={`w-2 h-2 rounded-full ${colorFor(doctors, d.id).dot}`} /> {d.name}</td>
                  <td className="px-4 py-3 text-right text-slate-600">{s.totalVisits}</td>
                  <td className="px-4 py-3 text-right text-slate-600">{s.completedVisits}</td>
                  <td className="px-4 py-3 text-right font-medium text-slate-700">{s.cases}</td>
                  <td className="px-4 py-3 text-right font-medium text-emerald-700">{s.completedProcedures}</td>
                  <td className="px-4 py-3 text-right font-medium text-amber-700">{money(s.totalPayments)}</td>
                </tr>
              );})}
              {doctors.length === 0 && <tr><td colSpan={6} className="px-4 py-6 text-center text-slate-500">No doctors yet.</td></tr>}
            </tbody>
            {doctors.length > 0 && (
              <tfoot><tr className="bg-amber-50 font-semibold text-amber-700">
                <td className="px-4 py-3">Clinic total</td>
                <td className="px-4 py-3 text-right">{doctors.reduce((s, d) => s + statsFor(d.id).totalVisits, 0)}</td>
                <td className="px-4 py-3 text-right">{doctors.reduce((s, d) => s + statsFor(d.id).completedVisits, 0)}</td>
                <td className="px-4 py-3 text-right">{doctors.reduce((s, d) => s + statsFor(d.id).cases, 0)}</td>
                <td className="px-4 py-3 text-right">{doctors.reduce((s, d) => s + statsFor(d.id).completedProcedures, 0)}</td>
                <td className="px-4 py-3 text-right">{money(doctors.reduce((s, d) => s + statsFor(d.id).totalPayments, 0))}</td>
              </tr></tfoot>
            )}
          </table>
        </div>
      ) : (
        <div className="grid sm:grid-cols-4 gap-3 mb-5">
          {(() => { const s = statsFor(currentUser.doctorId); return (<>
            <StatCard label="Total visits" value={s.totalVisits} />
            <StatCard label="Completed patients" value={s.completedVisits} />
            <StatCard label="Cases worked" value={s.cases} />
            <StatCard label="Completed procedures" value={s.completedProcedures} />
            <StatCard label="Total payments" value={money(s.totalPayments)} />
          </>); })()}
        </div>
      )}

      {isAdmin ? (
        <div className="space-y-4">
          {doctors.map((d) => {
            const breakdown = procedureBreakdownFor(d.id);
            return (
              <div key={d.id} className="bg-white rounded-2xl border border-sky-100 overflow-hidden">
                <div className="px-4 py-3 bg-sky-50/50 border-b border-sky-100 text-sm font-semibold text-slate-700 flex items-center gap-2">
                  <span className={`w-2 h-2 rounded-full ${colorFor(doctors, d.id).dot}`} /> {d.name} — procedures this month
                </div>
                {breakdown.length === 0 && <div className="p-4 text-center text-xs text-slate-500">No treatments recorded this month.</div>}
                <div className="divide-y divide-sky-100">
                  {breakdown.map(([name, v]) => (
                    <div key={name} className="flex items-center justify-between px-4 py-2">
                      <span className="text-sm text-slate-700">{name}</span>
                      <span className="text-sm">
                        <span className="font-semibold text-emerald-700">{v.completed} completed</span>
                        {v.total > v.completed && <span className="text-slate-400"> · {v.total - v.completed} pending payment</span>}
                      </span>
                    </div>
                  ))}
                </div>
              </div>
            );
          })}
          {doctors.length === 0 && <div className="bg-white rounded-2xl border border-sky-100 p-6 text-center text-sm text-slate-500">No doctors yet.</div>}
        </div>
      ) : (
        <div className="bg-white rounded-2xl border border-sky-100 overflow-hidden">
          <div className="px-4 py-3 bg-sky-50/50 border-b border-sky-100 text-sm font-semibold text-slate-600">Your procedures this month</div>
          {(() => {
            const breakdown = procedureBreakdownFor(currentUser.doctorId);
            if (breakdown.length === 0) return <div className="p-6 text-center text-sm text-slate-500">No treatments recorded yet this month.</div>;
            return (
              <div className="divide-y divide-sky-100">
                {breakdown.map(([name, v]) => (
                  <div key={name} className="flex items-center justify-between px-4 py-2.5">
                    <span className="text-sm text-slate-700">{name}</span>
                    <span className="text-sm">
                      <span className="font-semibold text-emerald-700">{v.completed} completed</span>
                      {v.total > v.completed && <span className="text-slate-400"> · {v.total - v.completed} pending payment</span>}
                    </span>
                  </div>
                ))}
              </div>
            );
          })()}
        </div>
      )}
    </div>
  );
}
function StatCard({ label, value }) {
  return <div className="bg-white rounded-2xl border border-sky-100 p-5"><div className="text-xs text-slate-500 mb-1">{label}</div><div className="font-display text-2xl text-slate-800">{value}</div></div>;
}

// ---------- Account ----------
function AccountTab({ currentUser }) {
  const [current, setCurrent] = useState("");
  const [next, setNext] = useState("");
  const [msg, setMsg] = useState("");
  const [error, setError] = useState("");

  async function changePassword() {
    setMsg(""); setError("");
    if (!next || next.length < 6) { setError("New password must be at least 6 characters."); return; }
    try {
      const cred = firebase.auth.EmailAuthProvider.credential(currentUser.email, current);
      await auth.currentUser.reauthenticateWithCredential(cred);
      await auth.currentUser.updatePassword(next);
      setCurrent(""); setNext(""); setMsg("Password updated.");
    } catch (e) {
      setError("Current password is incorrect, or the update failed. Try again.");
    }
  }

  return (
    <div className="max-w-md">
      <h2 className="font-display text-lg text-slate-800 mb-4">Account</h2>
      <div className="bg-white rounded-2xl border border-sky-100 p-5 mb-4">
        <div className="flex items-center gap-3">
          <span className="w-10 h-10 rounded-full bg-amber-500 text-black flex items-center justify-center font-semibold">{currentUser.name?.[0] || "U"}</span>
          <div><div className="text-sm font-semibold text-slate-800">{currentUser.name}</div><div className="text-xs text-slate-500 flex items-center gap-1">{currentUser.role === "admin" && I("shield", { size: 12 })} {currentUser.role === "admin" ? "Administrator" : "Doctor"} · {currentUser.email}</div></div>
        </div>
      </div>
      <div className="bg-white rounded-2xl border border-sky-100 p-5">
        <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-3 flex items-center gap-1.5">{I("lock", { size: 13 })} Change password</div>
        <Field label="Current password"><input type="password" className={inputCls} value={current} onChange={(e) => setCurrent(e.target.value)} /></Field>
        <Field label="New password"><input type="password" className={inputCls} value={next} onChange={(e) => setNext(e.target.value)} /></Field>
        {error && <p className="text-xs text-rose-600 mb-3">{error}</p>}
        {msg && <p className="text-xs text-emerald-600 mb-3">{msg}</p>}
        <button onClick={changePassword} className={`w-full ${btnPrimary}`}>Update password</button>
      </div>
      <button onClick={() => auth.signOut()} className="w-full flex items-center justify-center gap-2 text-rose-600 font-medium text-sm mt-4 py-2.5">{I("logout", { size: 16 })} Sign out</button>
    </div>
  );
}

// ---------- Search ----------
function PatientSearch({ doctors, appointments, payments, currentUser, isAdmin, onClose }) {
  const [q, setQ] = useState("");
  const query = q.trim().toLowerCase();
  const apptResults = query.length < 2 ? [] : appointments.filter((a) => a.patientName?.toLowerCase().includes(query) && (isAdmin || a.doctorId === currentUser.doctorId));
  const payResults = query.length < 2 ? [] : payments.filter((p) => p.patientName?.toLowerCase().includes(query) && (isAdmin || p.doctorId === currentUser.doctorId));
  return (
    <Sheet title="Find patient" onClose={onClose} wide>
      <div className="relative mb-4">
        <span className="absolute left-3 top-1/2 -translate-y-1/2 text-slate-500">{I("search", { size: 16 })}</span>
        <input autoFocus className={`${inputCls} pl-9`} placeholder="Type a patient name…" value={q} onChange={(e) => setQ(e.target.value)} />
      </div>
      {query.length >= 2 && apptResults.length === 0 && payResults.length === 0 && <p className="text-sm text-slate-500 text-center py-4">No matching records found.</p>}
      {apptResults.length > 0 && (
        <div className="mb-4">
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Appointments</div>
          <div className="space-y-1.5">{apptResults.map((a) => { const doc = doctors.find((d) => d.id === a.doctorId); return (
            <div key={a.id} className="text-sm border border-sky-100 rounded-lg px-3 py-2 flex justify-between text-slate-700"><span>{a.patientName} <span className="text-slate-500">· {doc?.name || "—"}</span></span><span className="text-slate-500">{a.date}</span></div>
          );})}</div>
        </div>
      )}
      {payResults.length > 0 && (
        <div>
          <div className="text-xs font-semibold text-slate-400 uppercase tracking-wide mb-2">Payments</div>
          <div className="space-y-1.5">{payResults.map((p) => { const doc = doctors.find((d) => d.id === p.doctorId); return (
            <div key={p.id} className="text-sm border border-sky-100 rounded-lg px-3 py-2 flex justify-between text-slate-700"><span>{p.patientName} <span className="text-slate-500">· {doc?.name || "—"}</span></span><span className="font-medium text-amber-700">{money(p.paidAmount)}</span></div>
          );})}</div>
        </div>
      )}
    </Sheet>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
